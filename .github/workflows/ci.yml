name: CI - Barberia

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar herramientas
        run: |
          pip install black flake8 pylint pytest bandit

      # LINT
      - name: Black
        run: |
          python -m black src --check

      - name: Flake8
        run: |
          python -m flake8 src

      - name: Pylint
        run: |
          python -m pylint src || true

      # TESTS
      - name: Pytest
        run: |
          python -m pytest

      # SEGURIDAD
      - name: Bandit
        run: |
          python -m bandit -r src -ll
